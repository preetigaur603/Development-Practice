<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
</head>
<body>
  <h1>Book Management System</h1>
  <h2>Add Book</h2>
  <form>
    <label for="title">Title</label>
    <input type = "text" id="title" name="title" placeholder="Enter the title">
    <br><br>
    <label for="author">Author</label>
    <input type = "text" id="author" name="author" placeholder="Enter author name">
    <br><br>

    <label for="isbn">ISBN</label>
    <input type = "text" id="isbn" name="isbn" placeholder="Enter isbn number">

    <br><br>
    <label for="publication-date">Publication Date</label>
    <input type = "date" id="publication-date" name="publication-date" placeholder="Enter publishied date">

    <br><br>

    <label for="genre">Genre</label>
    <input type = "text" id="genre" name="genre" placeholder="Enter books genre">

    <br><br>
    <button type = "submit">Add Book</button>
  </form>
    <div id = "bookList"></div>
    <script src="script.js"></script>
</body>
</html>
